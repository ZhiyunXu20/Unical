# Builds the timetable → .ics tool (ics-tool/) and publishes it to the
# personal site at https://zhiyunxu20.github.io/projects/unical/.
#
# One-time setup (see ics-tool/README.md):
#   1. Create an SSH key pair.
#   2. Personal site repo → Settings → Deploy keys: add the public key, tick "Allow write access".
#   3. This repo → Settings → Secrets and variables → Actions: add the private key as SITE_DEPLOY_KEY.
# Until the secret exists the workflow still builds and tests, and skips publishing.

name: Deploy timetable tool

on:
  push:
    branches: [demo]
    paths:
      - 'ics-tool/**'
      - '.github/workflows/deploy-ics-tool.yml'
  workflow_dispatch:

concurrency:
  group: deploy-ics-tool
  cancel-in-progress: true

env:
  SITE_REPO: ZhiyunXu20/zhiyunxu20.github.io
  SITE_PATH: projects/unical

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ics-tool
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ics-tool/package-lock.json

      - run: npm ci

      # Refresh Liverpool term dates from liverpool.ac.uk. Never fails the build:
      # on any problem the dates bundled in src/data/ are used.
      - name: Update Liverpool term dates
        run: npm run update-terms
        continue-on-error: true

      - run: npm test

      - run: npm run build

      - name: Check deploy key
        id: key
        env:
          KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice::SITE_DEPLOY_KEY is not set, so the build was not published. See ics-tool/README.md."
          fi

      - name: Check out personal site
        if: steps.key.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SITE_REPO }}
          ssh-key: ${{ secrets.SITE_DEPLOY_KEY }}
          path: site

      - name: Publish to ${{ env.SITE_PATH }}
        if: steps.key.outputs.present == 'true'
        working-directory: site
        run: |
          mkdir -p "$SITE_PATH"
          rsync -a --delete "$GITHUB_WORKSPACE/ics-tool/dist/" "$SITE_PATH/"
          git add -A "$SITE_PATH"
          if git diff --cached --quiet; then
            echo "No changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Unical timetable tool (${GITHUB_SHA::7})"
          git push
